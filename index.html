<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANYWAYS Academy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#161c2d;--navy-2:#1e2639;--line:rgba(255,255,255,.12);--text:#fff;--faint:rgba(255,255,255,.62);--yellow:#ffc000}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--text);font-family:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 24px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
header svg{height:30px;width:auto;display:block}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font:inherit;font-size:14px;font-weight:500;color:var(--faint);background:none;border:1px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer}
.langs button[aria-pressed=true]{color:var(--yellow);border-color:var(--line)}
h1{font-size:clamp(34px,6vw,56px);font-weight:600;line-height:1.05;margin:56px 0 10px}
h1 span{color:var(--yellow)}
.lead{color:var(--faint);font-size:19px;margin-bottom:40px}
article{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:28px}
video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.meta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px}
.meta b{color:var(--yellow);font-weight:600;margin-right:10px}
.meta h2{font-size:22px;font-weight:600}
.meta a{color:var(--navy);background:var(--yellow);text-decoration:none;font-weight:600;font-size:15px;padding:9px 16px;border-radius:8px}
.meta a:hover{filter:brightness(1.08)}
#tools h2{font-size:28px;font-weight:600;margin:56px 0 18px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.tool{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.tool h3{font-size:20px;font-weight:600}
.tool p{color:var(--faint);font-size:15px;line-height:1.5;flex:1}
.tool a{align-self:flex-start;color:var(--navy);background:var(--yellow);text-decoration:none;font-weight:600;font-size:15px;padding:9px 16px;border-radius:8px}
.tool a:hover{filter:brightness(1.08)}
footer{color:var(--faint);font-size:14px;margin-top:40px}
footer a{color:var(--faint)}
button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header><svg viewBox="0 0 240 48" role="img" aria-label="ANYWAYS"><g transform="translate(0,4)">
  <g transform="translate(0,0)">
    <g transform="scale(1.6667)" fill="#ffc000" stroke="none">
      <g transform="rotate(180,12,12)">
        <path d="m3.5 4c-.2761.0-.5.2239-.5.5v5.293c0 .1326.0527.26.1465.353.1952.196.5118.196.707.0L6.043 7.957l3.6816 3.682a2.1523 2.1183.0 011.7794-1.049L7.457 6.543l1.6895-1.6895c.0938-.0938.1465-.2209.1465-.3535.0-.2761-.2239-.5-.5-.5H3.5zM13 14.293a2.1523 2.1183.0 01-1.418.529 2.1523 2.1183.0 01-.582-.08V20c0 .552.448 1 1 1s1-.448 1-1v-5.707z" transform="rotate(180 12 12)"/>
        <path opacity=".3" d="m7.2448 17.145 2.0017 2.0017c.093768.09377.14645.22094.14645.35355.0.27614-.22386.5-.5.5h-5.364c-.27614.0-.5-.22386-.5-.5v-5.364c0-.13261.052678-.25978.14645-.35355.19526-.19526.51184-.19526.70711.0l1.9432 1.9432 3.0284-2.5625 1.2919 1.5268z"/>
      </g>
      <ellipse rx="2.1523" ry="2.1183" cy="12.61" cx="11.72" stroke-width="1.4226" stroke="#ffc000" fill="none"/>
    </g>
    <text x="49" y="29" fill="#ffffff"
          font-family="'HK Grotesk','Segoe UI',system-ui,sans-serif"
          font-size="22" font-weight="400" letter-spacing="1.8">ANYWAYS</text>
  </g></g></svg><nav class="langs" aria-label="Language"></nav></header>
  <h1>ANYWAYS <span>Academy</span></h1>
  <p class="lead" id="lead"></p>
  <main id="list"></main>
  <section id="tools" hidden><h2></h2><div class="tools"></div></section>
  <footer><a href="https://www.anyways.eu">www.anyways.eu</a></footer>
</div>
<script type="application/json" id="data">{"items": [{"id": "A1.2", "titles": {"de": "Ihr erstes Projekt anlegen", "en": "Create your first project", "es": "Cree su primer proyecto", "fr": "Créer votre premier projet"}, "videos": {"de": "A1.2/A1.2_v3_de.mp4", "en": "A1.2/A1.2_v3_en.mp4", "es": "A1.2/A1.2_v3_es.mp4", "fr": "A1.2/A1.2_v3_fr.mp4"}, "slides": "A1.2/A1.2_v3_slides.html"}, {"id": "F1.1", "titles": {"de": "Routenplanung in QGIS", "en": "Route planning in QGIS", "es": "Cálculo de rutas en QGIS", "fr": "Calcul d'itinéraires dans QGIS"}, "videos": {"de": "F1.1/F1.1_v1_de.mp4", "en": "F1.1/F1.1_v1_en.mp4", "es": "F1.1/F1.1_v1_es.mp4", "fr": "F1.1/F1.1_v1_fr.mp4"}, "slides": "F1.1/F1.1_v1_slides.html"}], "tools": [{"href": "tools/kilometre-statistics.html", "title": "Kilometre statistics", "desc": "Drop the GeoJSON files of an ANYWAYS report export and get the kilometres travelled, trip lengths, road types, busiest streets and an estimated travel time. Download as CSV or Word report. Everything runs in your browser."}, {"href": "tools/masterplan-designer.html", "title": "Masterplan Designer", "desc": "Sketch a masterplan on the map: buildings, programme and street profiles, with a 3D view, land-use balance, trip generation, parking demand and a cost estimate. Export to ANYWAYS. Interface in Dutch."}], "langs": ["en", "de", "es", "fr"], "names": {"en": "English", "fr": "Français", "de": "Deutsch", "es": "Español", "nl": "Nederlands"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const LEAD = {en:'Short tutorials on how to use ANYWAYS.', fr:'De courts tutoriels pour utiliser ANYWAYS.',
  de:'Kurze Tutorials zur Nutzung von ANYWAYS.', es:'Tutoriales breves sobre cómo usar ANYWAYS.', nl:'Korte tutorials over het gebruik van ANYWAYS.'};
const READ = {en:'Read as slides', fr:'Lire en diapositives', de:'Als Folien lesen', es:'Leer como diapositivas', nl:'Lezen als slides'};
const TOOLS = {en:'Tools', fr:'Outils', de:'Werkzeuge', es:'Herramientas', nl:'Tools'};
const OPEN = {en:'Open tool', fr:'Ouvrir l’outil', de:'Werkzeug öffnen', es:'Abrir herramienta', nl:'Tool openen'};
const store = {get(){try{return localStorage.getItem('academy-lang')}catch(e){return null}},
               set(v){try{localStorage.setItem('academy-lang', v)}catch(e){}}};
function pick(){
  const q = new URLSearchParams(location.search).get('lang');
  for (const c of [q, store.get(), ...(navigator.languages || [navigator.language])]) {
    const l = (c || '').slice(0, 2).toLowerCase(); if (D.langs.includes(l)) return l;
  }
  return 'en';
}
let lang = pick();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  document.documentElement.lang = lang;
  document.getElementById('lead').textContent = LEAD[lang] || LEAD.en;
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  document.getElementById('list').innerHTML = D.items.map(it => {
    const v = it.videos[lang] || it.videos.en, t = it.titles[lang] || it.titles.en;
    const slides = it.slides ? `<a href="${esc(it.slides)}?lang=${lang}">${esc(READ[lang] || READ.en)}</a>` : '';
    return `<article><video controls preload="metadata" src="${esc(v)}"></video>
      <div class="meta"><h2><b>${esc(it.id)}</b>${esc(t)}</h2>${slides}</div></article>`;
  }).join('');
  const sec = document.getElementById('tools');
  sec.hidden = !(D.tools && D.tools.length);
  sec.querySelector('h2').textContent = TOOLS[lang] || TOOLS.en;
  sec.querySelector('.tools').innerHTML = (D.tools || []).map(t =>
    `<div class="tool"><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><a href="${esc(t.href)}">${esc(OPEN[lang] || OPEN.en)}</a></div>`).join('');
}
const nav = document.querySelector('.langs');
nav.innerHTML = D.langs.map(l => `<button data-l="${l}" title="${esc(D.names[l] || l)}">${l.toUpperCase()}</button>`).join('');
nav.addEventListener('click', e => { if (e.target.dataset.l) { lang = e.target.dataset.l; store.set(lang); render(); } });
render();
</script>
</body>
</html>
