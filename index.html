<style>
:root{--navy:#161c2d;--navy-2:#1e2639;--navy-3:#252e44;--line:rgba(255,255,255,.12);--text:#fff;--faint:rgba(255,255,255,.62);--dim:rgba(255,255,255,.38);--yellow:#ffc000}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--navy);color:var(--text);font-family:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(22,28,45,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:22px;height:64px}
.top svg{height:28px;width:auto;display:block}
.menu{display:flex;gap:4px;flex:1}
.menu a{text-decoration:none;color:var(--faint);font-size:15px;font-weight:500;padding:7px 10px;border-radius:8px}
.menu a:hover{color:#fff;background:var(--navy-2)}
.langs{display:flex;gap:2px}
.langs button{font:inherit;font-size:13px;font-weight:500;color:var(--faint);background:none;border:1px solid transparent;border-radius:6px;padding:4px 8px;cursor:pointer}
.langs button[aria-pressed=true]{color:var(--yellow);border-color:var(--line)}
.btn{display:inline-block;color:var(--navy);background:var(--yellow);text-decoration:none;font-weight:600;font-size:15px;padding:9px 16px;border-radius:8px;white-space:nowrap;border:0;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:#fff;border:1px solid var(--line)}
/* hero */
.hero{padding:56px 0 24px}
h1{font-size:clamp(36px,6vw,60px);font-weight:600;line-height:1.05;letter-spacing:-.02em}
h1 span{color:var(--yellow)}
.lead{color:var(--faint);font-size:19px;margin-top:12px;max-width:720px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px}
.tile{display:block;text-decoration:none;background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;transition:border-color .15s}
.tile:hover{border-color:var(--yellow)}
.tile .n{font-size:34px;font-weight:600;color:var(--yellow);line-height:1}
.tile .t{font-size:18px;font-weight:600;margin-top:10px}
.tile .d{font-size:14px;color:var(--faint);margin-top:4px}
/* sections */
section{padding:48px 0 8px;scroll-margin-top:72px}
section>.wrap>h2{font-size:30px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--faint);font-size:16px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.chips button{font:inherit;font-size:14px;font-weight:500;color:var(--faint);background:var(--navy-2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chips button[aria-pressed=true]{color:var(--navy);background:var(--yellow);border-color:var(--yellow)}
.track{margin-top:26px}
.track h3{font-size:17px;font-weight:600;color:var(--faint);display:flex;align-items:center;gap:10px}
.track h3 b{color:var(--navy);background:var(--yellow);border-radius:6px;padding:1px 8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:14px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.card .id{font-size:13px;font-weight:600;color:var(--yellow)}
.card h4{font-size:19px;font-weight:600;line-height:1.3}
.card p{color:var(--faint);font-size:15px;line-height:1.5;flex:1}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.card .acts .btn{font-size:14px;padding:7px 12px}
.card.soon{background:none;border-style:dashed}
.card.soon .id,.card.soon h4,.card.soon p{color:var(--dim)}
.card.soon .tag{font-size:13px;color:var(--dim)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.tool{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.tool h3{font-size:20px;font-weight:600}
.tool p{color:var(--faint);font-size:15px;line-height:1.5;flex:1}
.tool .btn{align-self:flex-start}
.empty{margin-top:22px;background:none;border:1px dashed var(--line);border-radius:14px;padding:26px;color:var(--faint);font-size:16px}
.band{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--navy-2);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:14px;padding:22px 26px}
.band p{color:var(--faint);font-size:16px;max-width:680px}
.band strong{display:block;color:#fff;font-size:20px;font-weight:600;margin-bottom:4px}
footer{color:var(--faint);font-size:14px;padding:56px 0 48px}
footer a{color:var(--faint)}
button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (max-width:860px){.menu{display:none}.tiles{grid-template-columns:1fr 1fr}.top .book{display:none}}
</style>
</head>

const TRACKS = {
 A:{en:'Getting started',fr:'Premiers pas',de:'Erste Schritte',es:'Primeros pasos',nl:'Aan de slag'},
 B:{en:'Editing the network',fr:'Modifier le réseau',de:'Netz bearbeiten',es:'Editar la red',nl:'Netwerk bewerken'},
 C:{en:'Datasets',fr:'Jeux de données',de:'Datensätze',es:'Conjuntos de datos',nl:'Datasets'},
 D:{en:'Analysing results',fr:'Analyser les résultats',de:'Ergebnisse analysieren',es:'Analizar resultados',nl:'Resultaten analyseren'},
 E:{en:'Sharing and exporting',fr:'Partager et exporter',de:'Teilen und exportieren',es:'Compartir y exportar',nl:'Delen en exporteren'},
 F:{en:'QGIS and AI',fr:'QGIS et IA',de:'QGIS und KI',es:'QGIS e IA',nl:'QGIS en AI'}};
const store = {get(){try{return localStorage.getItem('academy-lang')}catch(e){return null}},
               set(v){try{localStorage.setItem('academy-lang', v)}catch(e){}}};
const UI_LANGS = ['en','fr','de','es','nl'];
function pick(){
  const q = new URLSearchParams(location.search).get('lang');
  for (const c of [q, store.get(), ...(navigator.languages || [navigator.language])]) {
    const l = (c || '').slice(0, 2).toLowerCase(); if (D.langs.includes(l)) return l;
  }
  return 'en';
}
let lang = pick(), track = 'all';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr = k => (T[lang] && T[lang][k]) || T.en[k];
const byId = Object.fromEntries(D.items.map(it => [it.id, it]));

function render(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = tr(e.dataset.t));
  document.getElementById('lead').textContent = tr('lead');
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  document.getElementById('n-tut').textContent = D.items.length;
  document.getElementById('n-tools').textContent = D.tools.length;
  document.getElementById('n-demos').textContent = D.demos.length || '—';
  const letters = [...new Set(D.catalogue.map(c => c.track))];
  document.getElementById('chips').innerHTML = ['all', ...letters].map(l =>
    `<button data-tr="${l}" aria-pressed="${l === track}">${l === 'all' ? esc(tr('all')) : esc(l + ' · ' + (TRACKS[l][lang] || TRACKS[l].en))}</button>`).join('');
  document.getElementById('tracks').innerHTML = letters.filter(l => track === 'all' || l === track).map(l => {
    const cards = D.catalogue.filter(c => c.track === l).map(c => {
      const it = byId[c.id];
      const desc = c.desc ? `<p>${esc(c.desc)}</p>` : '';
      if (!it) return `<div class="card soon"><div class="id">${esc(c.id)}</div><h4>${esc(c.title)}</h4>${desc}<div class="tag">${esc(tr('soon'))}</div></div>`;
      const t = it.titles[lang] || it.titles.en;
      const sl = it.slides ? `<a class="btn ghost" href="${esc(it.slides)}?lang=${lang}">${esc(tr('slides'))}</a>` : '';
      return `<div class="card"><div class="id">${esc(c.id)}</div><h4>${esc(t)}</h4>${desc}<div class="acts"><a class="btn" href="watch.html?id=${encodeURIComponent(c.id)}&lang=${lang}">▶ ${esc(tr('watch'))}</a>${sl}</div></div>`;
    }).join('');
    return `<div class="track"><h3><b>${l}</b>${esc(TRACKS[l][lang] || TRACKS[l].en)}</h3><div class="grid">${cards}</div></div>`;
  }).join('');
  document.getElementById('toollist').innerHTML = D.tools.map(t =>
    `<div class="tool"><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><a class="btn" href="${esc(t.href)}">${esc(tr('open'))}</a></div>`).join('');
  document.getElementById('demolist').innerHTML = D.demos.length ? D.demos.map(d =>
    `<div class="tool"><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p><a class="btn" href="${esc(d.href)}" target="_blank" rel="noopener">${esc(d.button || 'Open')}</a></div>`).join('')
    : `<div class="empty">${esc(tr('demos_empty'))}</div>`;
}
document.getElementById('chips').addEventListener('click', e => { const b = e.target.closest('[data-tr]'); if (b) { track = b.dataset.tr; render(); } });
const nav = document.querySelector('.langs');
nav.innerHTML = D.langs.map(l => `<button data-l="${l}" title="${esc(D.names[l] || l)}">${l.toUpperCase()}</button>`).join('');
nav.addEventListener('click', e => { if (e.target.dataset.l) { lang = e.target.dataset.l; store.set(lang); render(); } });
render();
</script>
</body>
</html>
