<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANYWAYS Academy</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://wimmichiels76.github.io/anyways-academy/">

<style>
:root{--navy:#161c2d;--line:rgba(255,255,255,.14);--faint:rgba(255,255,255,.62);--yellow:#ffc000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.page{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--navy);border-bottom:1px solid var(--line)}
.bar svg{height:24px;width:auto;display:block}
.bar h1{flex:1;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 b{color:var(--yellow);margin-right:8px}
.btn{display:inline-block;color:var(--navy);background:var(--yellow);text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:8px;white-space:nowrap;font-family:inherit;border:0;cursor:pointer}
.btn.ghost{background:none;color:#fff;border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
video{flex:1 1 auto;width:100%;min-height:0;background:#000;object-fit:contain;display:block}
.missing{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:18px}
a:focus-visible,button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@media (max-width:640px){.bar svg{display:none}.bar .slides{display:none}}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const CLOSE = {en:'✕ Close',fr:'✕ Fermer',de:'✕ Schließen',es:'✕ Cerrar',nl:'✕ Sluiten'};
const SLIDES = {en:'Read as slides',fr:'Lire en diapositives',de:'Als Folien lesen',es:'Leer como diapositivas',nl:'Lezen als slides'};
const MISSING = {en:'This tutorial is not available yet.',fr:'Ce tutoriel n’est pas encore disponible.',de:'Dieses Tutorial ist noch nicht verfügbar.',es:'Este tutorial aún no está disponible.',nl:'Deze tutorial is nog niet beschikbaar.'};
const q = new URLSearchParams(location.search);
let lang = (q.get('lang') || '').slice(0, 2);
if (!CLOSE[lang]) { try { lang = localStorage.getItem('academy-lang') || 'en'; } catch (e) { lang = 'en'; } }
if (!CLOSE[lang]) lang = 'en';
document.documentElement.lang = lang;
const it = D.items.find(x => x.id === q.get('id'));
const close = document.getElementById('close');
close.textContent = CLOSE[lang];
close.href = 'index.html?lang=' + lang + '#tutorials';
if (it) {
  const t = it.titles[lang] || it.titles.en;
  document.getElementById('title').innerHTML = '<b></b><span></span>';
  document.querySelector('#title b').textContent = it.id;
  document.querySelector('#title span').textContent = t;
  document.title = it.id + ' ' + t + ' · ANYWAYS Academy';
  document.getElementById('video').src = it.videos[lang] || it.videos.en;
  if (it.slides) { const s = document.getElementById('slides'); s.hidden = false; s.textContent = SLIDES[lang]; s.href = it.slides + '?lang=' + lang; }
} else {
  const v = document.getElementById('video'); const m = document.createElement('div');
  m.className = 'missing'; m.textContent = MISSING[lang]; v.replaceWith(m);
}
addEventListener('keydown', e => { if (e.key === 'Escape') location.href = close.href; });
</script>
