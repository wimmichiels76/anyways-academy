:root{--navy:#161c2d;--navy-2:#1e2639;--line:rgba(255,255,255,.12);--text:#fff;
  --faint:rgba(255,255,255,.62);--yellow:#ffc000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy);color:var(--text);
  font-family:'HK Grotesk','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.deck{height:100%;display:flex;flex-direction:column;container-type:inline-size}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px 0}
header svg{height:30px;width:auto;display:block}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--faint);
  background:none;border:1px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer}
.langs button[aria-pressed=true]{color:var(--yellow);border-color:var(--line)}
.langs button:hover{color:var(--text)}
main{flex:1;min-height:0;display:flex;padding:20px 28px}
.slide{flex:1;min-width:0;min-height:0;display:grid;gap:36px;align-items:center;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{font-size:15px;font-weight:500;letter-spacing:.03em;color:var(--faint);margin-bottom:10px}
.kicker b{color:var(--yellow);font-weight:600;margin-right:8px}
h1{font-size:clamp(28px,4.2cqw,54px);font-weight:600;line-height:1.08;letter-spacing:-.01em;margin-bottom:28px}
h2{font-size:clamp(22px,2.6cqw,34px);font-weight:600;line-height:1.2;margin-bottom:16px}
p{font-size:clamp(16px,1.6cqw,20px);line-height:1.55;color:var(--faint);max-width:44ch}
strong{color:var(--yellow);font-weight:600}
ol{list-style:none;display:grid;gap:14px;counter-reset:s}
ol li{counter-increment:s;display:flex;align-items:center;gap:16px;font-size:clamp(17px,1.9cqw,24px);line-height:1.3}
ol li::before{content:counter(s);flex:none;width:36px;height:36px;border:2px solid var(--yellow);border-radius:50%;
  display:grid;place-items:center;color:var(--yellow);font-weight:600;font-size:16px}
.cover{grid-template-columns:minmax(0,1fr);max-width:900px;margin:0 auto;width:100%}
.step,.recap{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
figure{min-width:0;min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
figure img{max-width:100%;max-height:100%;border-radius:10px;border:1px solid var(--line);
  box-shadow:0 12px 40px rgba(0,0,0,.35);background:var(--navy-2)}
.num{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--yellow);
  color:var(--navy);font-weight:600;font-size:20px;margin-bottom:18px}
.next{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:16px;color:var(--faint)}
.recap ol{gap:10px}.recap ol li{font-size:clamp(15px,1.5cqw,19px)}.recap ol li::before{width:28px;height:28px;font-size:13px}
footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px 20px}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--text);
  cursor:pointer;display:grid;place-items:center}
.nav:hover:not(:disabled){border-color:var(--yellow);color:var(--yellow)}
.nav:disabled{opacity:.3;cursor:default}
.nav svg{width:20px;height:20px}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button[aria-current=true]{background:var(--yellow);width:24px;border-radius:5px}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
@container (max-width:760px){
  header,main,footer{padding-left:16px;padding-right:16px}
  .step,.recap{grid-template-columns:minmax(0,1fr);align-content:start;gap:20px}
  figure{height:auto}
  figure img{width:100%;height:auto}
  main{overflow-y:auto}
}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const langs = Object.keys(D.text);
const store = {get(){try{return localStorage.getItem('academy-lang')}catch(e){return null}},
               set(v){try{localStorage.setItem('academy-lang', v)}catch(e){}}};
function pickLang(){
  const q = new URLSearchParams(location.search).get('lang');
  for (const c of [q, store.get(), ...(navigator.languages || [navigator.language])]) {
    const l = (c || '').slice(0, 2).toLowerCase();
    if (langs.includes(l)) return l;
  }
  return langs.includes('en') ? 'en' : langs[0];
}
let lang = pickLang(), i = Math.max(0, parseInt(location.hash.slice(1) || '1', 10) - 1);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const plain = s => s.replace(/\*\*/g, '');

function slides(){
  const t = D.text[lang], n = t.steps.length, out = [];
  const kicker = h => `<div class="kicker"><b>${esc(D.id)}</b>${esc(h)}</div>`;
  const list = `<ol>${t.steps.map(s => `<li><span>${rich(s)}</span></li>`).join('')}</ol>`;
  out.push(`<section class="slide cover">${kicker(t.intro_heading)}<h1>${esc(t.title)}</h1>${list}</section>`);
  t.steps.forEach((s, k) => {
    const img = D.images[k];
    out.push(`<section class="slide step"><figure>${img ? `<img src="${img}" alt="${esc(plain(s))}">` : ''}</figure>
      <div><div class="num" aria-hidden="true">${k + 1}</div>
      <div class="kicker">${esc(t.step_label.replace('{n}', k + 1).replace('{total}', n))}</div>
      <h2>${rich(s)}</h2><p>${rich((t.details || [])[k] || '')}</p></div></section>`);
  });
  const res = D.images[n];
  out.push(`<section class="slide recap"><figure>${res ? `<img src="${res}" alt="${esc(t.subs.scenarios || '')}">` : ''}</figure>
    <div>${kicker(t.recap_heading)}<h1>${esc(t.title)}</h1>${list}${t.next ? `<div class="next">${esc(t.next)}</div>` : ''}</div></section>`);
  return out;
}

const $ = s => document.querySelector(s);
function render(){
  const all = slides();
  i = Math.min(Math.max(i, 0), all.length - 1);
  document.documentElement.lang = lang;
  document.title = `${D.id} · ${D.text[lang].title} — ANYWAYS Academy`;
  $('main').innerHTML = all[i];
  $('.dots').innerHTML = all.map((_, k) =>
    `<button aria-label="${k + 1}" ${k === i ? 'aria-current="true"' : ''} data-k="${k}"></button>`).join('');
  $('#prev').disabled = i === 0;
  $('#next').disabled = i === all.length - 1;
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  history.replaceState(null, '', `${location.pathname}${location.search}#${i + 1}`);
}
function go(d){ i += d; render(); }

$('.langs').innerHTML = langs.map(l => `<button data-l="${l}">${l.toUpperCase()}</button>`).join('');
$('.langs').addEventListener('click', e => { const l = e.target.dataset.l; if (l) { lang = l; store.set(l); render(); } });
$('.dots').addEventListener('click', e => { if (e.target.dataset.k) { i = +e.target.dataset.k; render(); } });
$('#prev').addEventListener('click', () => go(-1));
$('#next').addEventListener('click', () => go(1));
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  if (e.key === 'Home') { i = 0; render(); }
  if (e.key === 'End') { i = 1e9; render(); }
});
let x0 = null;
addEventListener('pointerdown', e => { x0 = e.clientX; });
addEventListener('pointerup', e => {
  if (x0 !== null && Math.abs(e.clientX - x0) > 60 && e.pointerType !== 'mouse') go(e.clientX < x0 ? 1 : -1);
  x0 = null;
});
addEventListener('hashchange', () => {
  const k = parseInt(location.hash.slice(1), 10) - 1;
  if (k >= 0 && k !== i) { i = k; render(); }
});
render();
</script>
</body>
</html>
